# Publishes to npm when a version tag is pushed.
#
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret required, and
# provenance is attached automatically. Before the first release, configure
# this repository + workflow as a trusted publisher for the gulp-once
# package at https://www.npmjs.com/package/gulp-once/access
name: release

on:
    push:
        tags: ['v*']

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - run: pnpm build
            - run: npm pack --dry-run
            - run: npm publish
