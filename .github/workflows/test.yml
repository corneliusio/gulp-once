name: test

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [22, 24, 26]
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm exec oxfmt --check
            - run: pnpm test
            - run: pnpm build
            # the emitted declarations must be consumable by a TypeScript consumer
            - run: pnpm check:dist
            # the ESM build must stay require()-able from CommonJS gulpfiles
            - run: node -e "const assert = require('node:assert'); assert.equal(typeof require('./dist/index.js'), 'function'); assert.equal(typeof require('./dist/index.js').GulpOnceError, 'function')"
